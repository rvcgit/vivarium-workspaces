# ==========================================================
# VIVARIUM WORKSPACE APPEARANCE CONFIGURATION
# ==========================================================

# Display mode:
# number = 123456789
# name   = WEB CODE TERM DOCS ...
# icon   = Nerd Font icons
# custom = User-defined combination

WS_DISPLAY_MODE="custom"

# Optional workspace names
WS1_NAME="WEB"
WS2_NAME="CODE"
WS3_NAME="TERM"
WS4_NAME="DOCS"
WS5_NAME="MEDIA"
WS6_NAME="FILES"
WS7_NAME="CHAT"
WS8_NAME="LAB"
WS9_NAME="MISC"

# Optional Nerd Font icons
WS1_ICON="󰖟"
WS2_ICON="󰅩"
WS3_ICON=""
WS4_ICON="󰈙"
WS5_ICON="󰝚"
WS6_ICON="󰉋"
WS7_ICON="󰭹"
WS8_ICON="󰆍"
WS9_ICON="󰋼"

# Icon + name separator
WS_SEPARATOR=" "

# Custom display strings (used only in custom mode)
WS1_CUSTOM="󰖟 WEB"
WS2_CUSTOM="󰅩 CODE"
WS3_CUSTOM=" TERM"
WS4_CUSTOM="󰈙 DOCS"
WS5_CUSTOM="󰝚 MEDIA"
WS6_CUSTOM="󰉋 FILES"
WS7_CUSTOM="󰭹 CHAT"
WS8_CUSTOM="󰆍 LAB"
WS9_CUSTOM="󰋼 MISC"

# Workspace colours
ACTIVE="#00E676"   ### GREEN
OCCUPIED="#7895B2" ### pale blue
EMPTY="#4F545C"    ### Dark Gray

# Optional icon-only display
# Set to true to display icons without numbers or names
WS_ICON_ONLY=false
